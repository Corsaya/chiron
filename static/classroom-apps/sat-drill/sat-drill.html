<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAT Adaptive Drill — Chiron</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #16161a; color: #e8e8ea; min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 22px 20px 90px; }

  header.bar {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid #2a2a30; position: sticky; top: 0; background: #16161a; z-index: 5;
  }
  header.bar a { color: #9aa3ff; text-decoration: none; font-size: 14px; }
  header.bar h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; }
  .bar-stat { font-size: 12px; color: #8a8a92; }

  h2.page-title { font-size: 24px; margin: 4px 0 6px; }
  p.lede { color: #a0a0a8; font-size: 14.5px; line-height: 1.6; margin: 0 0 22px; max-width: 640px; }

  /* --- domain picker --- */
  .sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #6d6d75; margin: 26px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .card {
    background: #1e1e24; border: 1px solid #2a2a30; border-radius: 10px; padding: 15px;
    cursor: pointer; transition: border-color .15s;
  }
  .card:hover { border-color: #4a4aff; }
  .card.weak { border-color: #6b4a2f; }
  .card.weak:hover { border-color: #d98a4a; }
  .card .name { font-weight: 600; font-size: 14.5px; margin-bottom: 3px; }
  .card .meta { font-size: 11.5px; color: #8a8a92; }
  .weak-tag { display: inline-block; font-size: 10px; color: #e0a267; background: #2e2318;
              border: 1px solid #6b4a2f; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .card .bar-track { height: 4px; border-radius: 3px; background: #2a2a30; overflow: hidden; margin-top: 9px; }
  .card .bar-fill { height: 100%; background: #6fdc8c; width: 0; }

  .btn {
    background: #4a4aff; color: #fff; border: none; border-radius: 9px;
    padding: 10px 18px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: #1e1e24; border: 1px solid #2a2a30; color: #cacace; }
  .btn.ghost:hover { border-color: #4a4aff; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

  /* --- drill --- */
  .drill-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .skill-code { font-size: 11px; font-weight: 700; color: #9aa3ff; background: #21213a;
                border-radius: 5px; padding: 2px 7px; letter-spacing: .04em; }
  .skill-name { font-size: 15px; font-weight: 600; }
  .level-chip { font-size: 10.5px; border-radius: 999px; padding: 2px 9px; border: 1px solid; }
  .level-chip.lv1  { color: #e08a8a; border-color: #6b3030; background: #2a1a1a; }
  .level-chip.lv0  { color: #9aa3ff; border-color: #363661; background: #1d1d2e; }
  .level-chip.lvm1 { color: #e0b467; border-color: #6b5330; background: #26200f; }
  .level-chip.lvm2 { color: #d98a4a; border-color: #6b4a2f; background: #2a1c10; }

  .ladder-note {
    font-size: 12.5px; color: #d0a878; background: #241d12; border: 1px solid #4a3a22;
    border-radius: 8px; padding: 9px 12px; margin: 14px 0 0; line-height: 1.5;
  }
  .qbox { background: #1c1c22; border: 1px solid #2a2a30; border-radius: 12px; padding: 20px 22px; margin-top: 16px; }
  .qprompt { font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
  .qprompt .passage { display: block; border-left: 3px solid #363642; padding-left: 14px; margin-bottom: 14px; color: #d2d2da; }

  .choices { margin-top: 18px; display: flex; flex-direction: column; gap: 9px; }
  .choice {
    display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; border-radius: 9px;
    border: 1px solid #2a2a30; background: #1e1e24; cursor: pointer; font-size: 14.5px; line-height: 1.55;
    text-align: left; color: #e8e8ea; font-family: inherit;
  }
  .choice:hover:not(:disabled) { border-color: #4a4aff; }
  .choice .ltr {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid #45454f;
    font-size: 11.5px; display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .choice.sel { border-color: #4a4aff; background: #21213a; }
  .choice.sel .ltr { background: #4a4aff; border-color: #4a4aff; color: #fff; }
  .choice.correct { border-color: #2f5a3d; background: #16261c; }
  .choice.correct .ltr { background: #6fdc8c; border-color: #6fdc8c; color: #10240f; }
  .choice.wrong { border-color: #6b3030; background: #261616; }
  .choice.wrong .ltr { background: #e06767; border-color: #e06767; color: #2a0f0f; }
  .choice:disabled { cursor: default; }

  .gridin-row { margin-top: 18px; display: flex; gap: 9px; align-items: center; }
  .gridin-row input {
    background: #1e1e24; border: 1px solid #2a2a30; border-radius: 9px; color: #e8e8ea;
    padding: 11px 14px; font-size: 15px; width: 190px; font-family: inherit;
  }

  .feedback { margin-top: 18px; border-radius: 10px; padding: 14px 16px; font-size: 14.5px; line-height: 1.65; }
  .feedback.hint  { background: #241d12; border: 1px solid #4a3a22; color: #e0c489; }
  .feedback.right { background: #16261c; border: 1px solid #2f5a3d; }
  .feedback.wrongfb { background: #241618; border: 1px solid #5a2f34; }
  .feedback h4 { margin: 0 0 7px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .feedback .explain { color: #dcdce2; white-space: pre-wrap; }

  .desmos-tip {
    margin-top: 13px; background: #101f1a; border: 1px solid #2a5245; border-radius: 9px;
    padding: 11px 13px; font-size: 13.5px; line-height: 1.6; color: #9fe0c6; white-space: pre-wrap;
  }
  .desmos-tip b { color: #c8f4e2; }

  /* --- math bits (shared with sat-test) --- */
  .frac { display: inline-block; vertical-align: middle; text-align: center; margin: 0 .18em; }
  .frac .num { display: block; border-bottom: 1px solid currentColor; padding: 0 .25em; }
  .frac .den { display: block; padding: 0 .25em; }
  .sat-aligned { display: inline-block; line-height: 1.6; }

  /* --- results --- */
  .res-line { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #24242c; font-size: 14px; }
  .res-line .lbl { color: #cacace; }
  .res-line .val { color: #8a8a92; }
  .res-line .val.good { color: #6fdc8c; }
  .res-line .val.bad { color: #e08a8a; }
  .qlog { background: #1c1c22; border: 1px solid #2a2a30; border-radius: 10px; padding: 14px 16px; margin-top: 14px; font-size: 13.5px; color: #b8b8c0; line-height: 1.6; }
</style>
</head>
<body>
<header class="bar">
  <a href="/static/classroom.html">&larr; Classroom</a>
  <h1>SAT Adaptive Drill</h1>
  <span class="bar-stat" id="bar-stat"></span>
</header>
<div class="wrap" id="app"></div>
<script src="./data/advanced-math.js"></script>
<script src="./data/standard-english-conventions.js"></script>
<script src="./data/algebra.js"></script>
<script src="./data/geometry-and-trigonometry.js"></script>
<script src="./data/problem-solving-and-data-analysis.js"></script>
<script src="./data/information-and-ideas.js"></script>
<script src="./data/craft-and-structure.js"></script>
<script src="./data/expression-of-ideas.js"></script>
<script src="./sat-drill.js"></script>
</body>
</html>
