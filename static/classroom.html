<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Classroom — Chiron</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #16161a; color: #e8e8ea; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid #2a2a30; flex: 0 0 auto;
  }
  header a { color: #9aa3ff; text-decoration: none; font-size: 14px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .layout { flex: 1; display: flex; min-height: 0; }

  /* --- Sidebar --- */
  nav.side {
    width: 260px; flex: 0 0 260px; border-right: 1px solid #2a2a30;
    overflow-y: auto; padding: 14px 10px;
  }
  .crumb { font-size: 12px; color: #8a8a92; padding: 0 6px 10px; }
  .crumb a { color: #9aa3ff; text-decoration: none; cursor: pointer; }
  .side-classroom { margin-bottom: 4px; }
  .side-classroom-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13.5px;
  }
  .side-classroom-head:hover { background: #1e1e24; }
  .progress-pill {
    font-size: 10.5px; color: #8a8a92; background: #1e1e24; border: 1px solid #2a2a30;
    border-radius: 999px; padding: 1px 7px;
  }
  .progress-pill.done { color: #6fdc8c; border-color: #2f5a3d; }
  .side-materials { padding-left: 8px; display: none; }
  .side-materials.open { display: block; }
  .side-section-title {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: #6d6d75; margin: 10px 0 4px; padding-left: 4px;
  }
  .side-item {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 7px;
    cursor: pointer; font-size: 13px; color: #cacace;
  }
  .side-item:hover { background: #1e1e24; }
  .side-item.active { background: #262640; color: #fff; }
  .side-item .check { width: 13px; font-size: 11px; color: #6fdc8c; flex: 0 0 auto; }
  .side-item .icon { width: 15px; text-align: center; flex: 0 0 auto; }
  .side-item .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- Main content --- */
  main.content { flex: 1; min-width: 0; overflow-y: auto; padding: 26px 32px 80px; }
  .empty { color: #8a8a92; padding: 40px 0; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: #1e1e24; border: 1px solid #2a2a30; border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #4a4aff; }
  .card .name { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .card .bar-track { height: 5px; border-radius: 3px; background: #2a2a30; overflow: hidden; }
  .card .bar-fill { height: 100%; background: #6fdc8c; }
  .card .pct { font-size: 11.5px; color: #8a8a92; margin-top: 5px; }

  .lesson-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .lesson-title { font-size: 22px; font-weight: 700; margin: 0; }
  .mark-done-btn {
    font-size: 12.5px; padding: 6px 12px; border-radius: 8px; border: 1px solid #2a2a30;
    background: #1e1e24; color: #cacace; cursor: pointer; white-space: nowrap;
  }
  .mark-done-btn.done { color: #6fdc8c; border-color: #2f5a3d; }
  .lesson-body { line-height: 1.65; font-size: 15px; max-width: 780px; }
  .lesson-body h1, .lesson-body h2, .lesson-body h3 { line-height: 1.3; }
  .lesson-body h2 { border-bottom: 1px solid #2a2a30; padding-bottom: 6px; margin-top: 32px; }
  .lesson-body table { border-collapse: collapse; margin: 12px 0; }
  .lesson-body th, .lesson-body td { border: 1px solid #2a2a30; padding: 6px 10px; font-size: 14px; }
  .lesson-body code { background: #1e1e24; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .lesson-body pre { background: #1e1e24; border-radius: 8px; padding: 12px; overflow-x: auto; }
  .lesson-body blockquote { border-left: 3px solid #4a4aff; margin: 10px 0; padding: 2px 14px; color: #c2c2ce; background: #1c1c26; border-radius: 0 6px 6px 0; }
  iframe.app-frame { width: 100%; height: calc(100vh - 120px); border: 1px solid #2a2a30; border-radius: 10px; background: #fff; }

  /* --- Tutor panel --- */
  aside.tutor {
    width: 340px; flex: 0 0 340px; border-left: 1px solid #2a2a30;
    display: flex; flex-direction: column; min-height: 0;
  }
  .tutor-head { padding: 12px 14px; border-bottom: 1px solid #2a2a30; font-size: 13px; font-weight: 600; color: #cacace; display: flex; align-items: center; gap: 6px; }
  .tutor-msgs { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .tutor-msg { font-size: 13.5px; line-height: 1.5; padding: 9px 11px; border-radius: 10px; max-width: 100%; }
  .tutor-msg.user { background: #262640; align-self: flex-end; }
  .tutor-msg.assistant { background: #1e1e24; border: 1px solid #2a2a30; }
  .tutor-msg.assistant :is(p, ul, ol) { margin: 0 0 6px; }
  .tutor-empty { color: #75757e; font-size: 12.5px; padding: 8px; }
  .tutor-input-row { border-top: 1px solid #2a2a30; padding: 10px; display: flex; gap: 6px; }
  .tutor-input-row textarea {
    flex: 1; resize: none; background: #1e1e24; border: 1px solid #2a2a30; border-radius: 8px;
    color: #e8e8ea; padding: 8px 10px; font-size: 13px; min-height: 36px; max-height: 120px; font-family: inherit;
  }
  .tutor-input-row button {
    background: #4a4aff; color: white; border: none; border-radius: 8px;
    padding: 0 14px; font-size: 13px; cursor: pointer;
  }
  .tutor-input-row button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <a href="/">&larr; Chiron</a>
  <h1>Classroom</h1>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="content" id="main"><div class="empty">Loading…</div></main>
  <aside class="tutor" id="tutor" style="display:none">
    <div class="tutor-head">🎓 Tutor <span style="color:#75757e;font-weight:400">— asks about this lesson</span></div>
    <div class="tutor-msgs" id="tutor-msgs"><div class="tutor-empty">Ask about the material on this page — the tutor reads it as context.</div></div>
    <div class="tutor-input-row">
      <textarea id="tutor-input" placeholder="Ask a question…" rows="1"></textarea>
      <button id="tutor-send">Send</button>
    </div>
  </aside>
</div>
<script type="module" src="/static/classroom.js"></script>
</body>
</html>
