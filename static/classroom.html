<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Classroom — Chiron</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #16161a; color: #e8e8ea; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #2a2a30; position: sticky; top: 0; background: #16161a; z-index: 5; }
  header a { color: #9aa3ff; text-decoration: none; font-size: 14px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
  .crumb { font-size: 13px; color: #9a9aa2; margin-bottom: 16px; }
  .crumb a { color: #9aa3ff; text-decoration: none; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: #1e1e24; border: 1px solid #2a2a30; border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #4a4aff; }
  .card .name { font-weight: 600; font-size: 15px; }
  .material-list { display: flex; flex-direction: column; gap: 6px; }
  .material { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1e1e24; border: 1px solid #2a2a30; border-radius: 8px; cursor: pointer; }
  .material:hover { border-color: #4a4aff; }
  .material .icon { font-size: 15px; width: 20px; text-align: center; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8a8a92; margin: 20px 0 8px; }
  .empty { color: #8a8a92; padding: 40px 0; text-align: center; }
  .note-content { white-space: pre-wrap; line-height: 1.6; font-size: 14px; background: #1e1e24; border: 1px solid #2a2a30; border-radius: 10px; padding: 20px; }
  iframe.app-frame { width: 100%; height: calc(100vh - 120px); border: 1px solid #2a2a30; border-radius: 10px; background: #fff; }
</style>
</head>
<body>
<header>
  <a href="/">&larr; Chiron</a>
  <h1>Classroom</h1>
</header>
<main id="main">
  <div class="empty">Loading…</div>
</main>
<script src="/static/classroom.js"></script>
</body>
</html>
